<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DayPlan</title>
<meta name="theme-color" content="#0b1014">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@200;300;400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--tx:#e8efeb;--mut:#a6b6ae;--ac:#c4d6cc;--on:#0c1713;--card:rgba(22,29,32,.55);--bd:rgba(255,255,255,.13);--ln:rgba(255,255,255,.13);--wa:#ff9f8f;--fld:rgba(255,255,255,.07);--solid:#1a2326}
:root[data-t=light]{color-scheme:light;--tx:#13211b;--mut:#42564d;--ac:#2f5a49;--on:#f4faf6;--card:rgba(255,255,255,.55);--bd:rgba(255,255,255,.75);--ln:rgba(19,33,27,.16);--wa:#b3261e;--fld:rgba(255,255,255,.6);--solid:#eef3f0}
*{box-sizing:border-box}
body{margin:0;font-family:Lato,"Helvetica Neue",system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(160deg,#0b1014,#27303a);color:var(--tx);line-height:1.6;padding-bottom:6.5rem;-webkit-font-smoothing:antialiased;min-height:100vh}
:root[data-t=light] body{background:linear-gradient(160deg,#cfd9d6,#f3f6f4)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block}
#app{max-width:72rem;margin:0 auto;padding:1.2rem 1.2rem}
#app[data-v=day],#app[data-v=set]{max-width:46rem}
h1,h2,h3{font-weight:400;margin:0}h2{font-size:1.9rem;font-weight:300;letter-spacing:.02em;margin:.4rem 0 .8rem}h3{font-size:1.05rem;font-weight:700;margin-bottom:.5rem}
#app[data-v=set]>h1{font-size:2.2rem;font-weight:300;margin:.4rem 0 1rem}
.mut{color:var(--mut)}
.card{background:var(--card);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);border:1px solid var(--bd);border-radius:1rem;padding:1.1rem 1.2rem;margin:.8rem 0;transition:border-color .4s,transform .5s cubic-bezier(.2,.8,.2,1)}
.card:hover{border-color:var(--ac);transform:translateY(-2px)}
@supports not (backdrop-filter:blur(1px)){.card,nav,#md{background:var(--solid)}}
.btn{min-height:2.75rem;padding:.5rem 1.3rem;border-radius:2rem;border:1px solid transparent;background:var(--ac);color:var(--on);font:inherit;font-weight:700;letter-spacing:.05em;cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .3s,background .3s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn:not(.sec):not(.dng)::after{content:"→";display:inline-block;margin-left:.6rem;transition:transform .35s cubic-bezier(.2,.8,.2,1)}.btn:not(.sec):not(.dng):hover::after{transform:translateX(5px)}
.btn.sec{background:transparent;color:var(--tx);border-color:var(--ln)}.btn.sec:hover{border-color:var(--ac)}.btn.dng{background:var(--wa);color:#1b0805}
.lk{background:none;border:0;color:var(--tx);font:inherit;font-weight:700;padding:.4rem 0;cursor:pointer}.lk::after{content:"→";display:inline-block;margin-left:.5rem;transition:transform .35s}.lk:hover::after{transform:translateX(6px)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.acts{display:flex;flex-wrap:wrap;gap:.6rem;margin:.8rem 0}.acts.c{justify-content:center;margin-top:1.6rem}.row{display:flex;gap:.6rem;margin:.6rem 0}.row>*{flex:1}.col{display:flex;flex-direction:column;gap:.5rem}
label{display:block;margin:.6rem 0;font-weight:700;font-size:.95rem}
input,select{width:100%;min-height:2.6rem;margin-top:.25rem;padding:.4rem .8rem;border-radius:.8rem;border:1px solid var(--ln);background:var(--fld);color:var(--tx);font:inherit;font-weight:400}
option{background:#1a2326;color:#e8efeb}:root[data-t=light] option{background:#fff;color:#13211b}
input[type=radio],input[type=checkbox]{width:auto;min-height:0;margin:0 .4rem 0 0;accent-color:var(--ac)}.seg label{font-weight:400}
input[type=range]{padding:0;accent-color:var(--ac)}
.days{display:flex;gap:.6rem}.days label{margin:0;font-weight:400}
.err{color:var(--wa);font-weight:700}.warn{background:rgba(255,120,100,.14);border-left:3px solid var(--wa);padding:.5rem .8rem;border-radius:.4rem}
.cfb{border:1px dashed var(--wa);border-radius:1rem;padding:.9rem;margin:.8rem 0}
nav{position:fixed;left:50%;bottom:max(1rem,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;padding:.3rem;border-radius:2rem;background:var(--card);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);border:1px solid var(--bd);z-index:5}
nav button{position:relative;z-index:1;padding:.55rem 1.4rem;min-height:2.6rem;border:0;background:none;color:var(--mut);font:inherit;font-weight:700;letter-spacing:.06em;border-radius:2rem;cursor:pointer;transition:color .4s}
nav button[aria-current]{color:var(--on)}
#pill{position:absolute;top:.3rem;bottom:.3rem;left:0;width:0;border-radius:2rem;background:var(--ac);transition:transform .55s cubic-bezier(.65,0,.2,1),width .55s cubic-bezier(.65,0,.2,1)}
.hero{position:relative;min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 0}
.wm{font-size:clamp(3rem,14vw,9.5rem);font-weight:200;letter-spacing:.14em;color:var(--ac);line-height:1;margin:0;padding-left:.14em}
.wm span{display:inline-block}
.sub{font-size:clamp(.9rem,2.2vw,1.3rem);letter-spacing:.7em;padding-left:.7em;color:var(--ac);font-weight:300;margin-top:1rem}
.greet{color:var(--mut);margin:1.4rem 0 0}
.scrl{position:absolute;right:.5rem;top:50%;width:1px;height:6rem;background:var(--ln);overflow:hidden}
.scrl::after{content:"";position:absolute;left:0;top:0;width:100%;height:35%;background:var(--ac);animation:sc 2.8s cubic-bezier(.65,0,.35,1) infinite}
@media(max-width:700px){.scrl{display:none}}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));gap:1rem}.panels .card{margin:0}
.bar{display:flex;gap:.4rem;align-items:center}.bar input{flex:1;margin:0}
.tl{position:relative;margin:1rem 0 1rem 4.6rem;border-left:1px solid var(--ln)}
.ln{position:absolute;left:0;right:0;border-top:1px solid var(--ln)}.ln span{position:absolute;left:-4.6rem;top:-.75rem;width:4rem;text-align:right;font-size:.78rem;color:var(--mut)}
.blk{position:absolute;padding:.25rem .6rem;border-radius:.7rem;color:#fff;overflow:hidden;cursor:pointer;font-size:.85rem;line-height:1.35;border:1px solid rgba(255,255,255,.2);text-align:left;font-family:inherit;background-image:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0));box-shadow:0 6px 18px rgba(0,0,0,.25);transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .3s}
.blk:hover{transform:translateX(3px);filter:brightness(1.12)}
.blk.tr{background:var(--ln);color:var(--mut);cursor:default;left:1.2rem;right:0;box-shadow:none;border-style:dashed}
.blk.cf{outline:2px dashed var(--wa);background-image:repeating-linear-gradient(45deg,transparent 0 8px,rgba(255,255,255,.22) 8px 16px)}
.blk.dn{opacity:.5;text-decoration:line-through}
.nw{position:absolute;left:-.4rem;right:0;border-top:2px solid var(--wa);z-index:3}.nw::before{content:"";position:absolute;left:-.3rem;top:-.35rem;width:.6rem;height:.6rem;border-radius:50%;background:var(--wa)}
.blk.pulse{animation:p 1.6s ease-out 1!important}
.li{display:flex;justify-content:space-between;align-items:center;gap:.8rem;padding:.5rem 0;border-bottom:1px solid var(--ln)}.li:last-child{border:0}
#mo{display:flex;position:fixed;inset:0;background:rgba(4,8,10,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:9;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity .35s}
#mo.on{opacity:1;pointer-events:auto}
#md{background:var(--card);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:1px solid var(--bd);border-radius:1.2rem;padding:1.3rem;width:100%;max-width:26rem;max-height:90vh;overflow:auto}
#mo.on #md{animation:pop .55s cubic-bezier(.34,1.45,.64,1) both}
#ts{position:fixed;bottom:5.6rem;left:50%;transform:translate(-50%,12px);background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--bd);color:var(--tx);padding:.5rem 1.2rem;border-radius:2rem;opacity:0;transition:opacity .3s,transform .4s cubic-bezier(.2,.8,.2,1);pointer-events:none;z-index:10}
#ts.on{opacity:1;transform:translate(-50%,0)}
#app.anim>*:not(.hero):not(.panels){animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0)*80ms)}
#app.anim .panels .card{animation:rise .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:.9s}
#app.anim .panels .card:nth-child(2){animation-delay:1.05s}#app.anim .panels .card:nth-child(3){animation-delay:1.2s}
#app.anim .wm span{animation:letter 1.5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*90ms + 150ms)}
#app.anim .sub,#app.anim .greet,#app.anim .acts.c{animation:rise 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:.9s}
#app.anim .greet{animation-delay:1s}#app.anim .acts.c{animation-delay:1.1s}
#app.anim .blk:not(.tr){animation:grow .7s cubic-bezier(.2,.8,.2,1) both;transform-origin:top}
@keyframes rise{from{opacity:0;transform:translateY(20px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes letter{from{opacity:0;transform:translateY(.3em) scale(.96);filter:blur(16px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes grow{from{opacity:0;transform:scaleY(.6)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.94);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes sc{0%{transform:translateY(-100%)}100%{transform:translateY(300%)}}
@keyframes p{0%{box-shadow:0 0 0 0 var(--ac)}50%{box-shadow:0 0 0 14px rgba(196,214,204,.22)}100%{box-shadow:0 0 0 0 transparent}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="app"></div>
<nav aria-label="Main"><i id="pill"></i><button data-t="home" onclick="go('home')">Home</button><button data-t="day" onclick="go('day')">Day</button><button data-t="set" onclick="go('set')">Settings</button></nav>
<div id="mo" onclick="if(event.target===this)closeModal()"><div id="md" role="dialog" aria-modal="true"></div></div><div id="ts" role="status"></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K='dayplan_v1',D={theme:'dark',font:100,h24:false,wake:420,sleep:1380,brk:10},P={low:1,med:2,high:3};
const COL={low:'#56707f',med:'#3f7461',high:'#9a5e34',class:'#4f5f96'},PX=1.2;
let S={items:[],set:{...D}},view={tab:'home',date:ymd(new Date())},pend=null,fnp=null,T0v=0,anim=true;
try{const r=JSON.parse(localStorage.getItem(K));if(r){S.items=r.items||[];S.set={...D,...r.set}}}catch(e){}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(s,n){const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return ymd(d)}
const wd=s=>new Date(s+'T12:00').getDay(),nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const hm=m=>pad(Math.floor(m/60))+':'+pad(m%60),tm=s=>{const[a,b]=s.split(':');return+a*60+ +b};
function fmt(m){m=((m%1440)+1440)%1440;const h=Math.floor(m/60),i=m%60;return S.set.h24?pad(h)+':'+pad(i):((h+11)%12+1)+':'+pad(i)+(h<12?' AM':' PM')}
function save(){try{localStorage.setItem(K,JSON.stringify(S));flash('Saved')}catch(e){flash('Could not save in this browser')}}
function flash(m){const t=$('#ts');t.textContent=m;t.classList.add('on');clearTimeout(flash.t);flash.t=setTimeout(()=>t.classList.remove('on'),2200)}
function applyTheme(){const t=S.set.theme,dk=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.t=dk?'dark':'light';document.documentElement.style.fontSize=S.set.font+'%';window.bgRedraw&&bgRedraw()}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
/* scheduling */
const itemsOn=d=>S.items.filter(i=>d>=i.date&&(i.date===d||(i.days&&i.days.includes(wd(d)))));
const blocks=d=>itemsOn(d).filter(i=>!i.hold).map(i=>({i,s:i.start-(i.travel||0),e:i.start+i.dur}));
function findSlot(d,dur,tr,ign,from){const bl=blocks(d).filter(b=>b.i.id!==ign),p=S.set.brk;
for(let t=Math.max(S.set.wake,from||0);t+tr+dur<=S.set.sleep;t+=5){const e=t+tr+dur;if(!bl.some(b=>t<b.e+p&&b.s-p<e))return t+tr}return null}
function hits(it){const s=it.start-it.travel,e=it.start+it.dur;return blocks(it.date).filter(b=>s<b.e&&b.s<e)}
function cm(A,B){if(B.start<A.start)[A,B]=[B,A];const ae=A.start+A.dur,be=B.start+B.dur;
if(A.start<be&&B.start<ae){const n=Math.min(ae,be)-Math.max(A.start,B.start);return `${A.name} (${fmt(A.start)}-${fmt(ae)}) overlaps with ${B.name} (${fmt(B.start)}-${fmt(be)}) by ${n} minutes.`}
return `You won't have enough time to travel to ${B.name} after ${A.name}.`}
function confl(d){const bl=blocks(d),o=[];for(let a=0;a<bl.length;a++)for(let b=a+1;b<bl.length;b++)if(bl[a].s<bl[b].e&&bl[b].s<bl[a].e)o.push({a:bl[a].i,b:bl[b].i});return o}
function replan(d){const au=itemsOn(d).filter(i=>i.auto&&i.type==='plan'&&!i.done);au.forEach(i=>i.hold=true);
au.sort((a,b)=>P[b.prio]-P[a.prio]||b.dur-a.dur);let miss=0;
au.forEach(i=>{const t=findSlot(d,i.dur,i.travel,i.id,0);if(t==null)miss++;else{i.start=t;i.hold=false}});save();return miss}
function planDay(d){const m=replan(d);render();flash(m?m+' item(s) did not fit. See "Not scheduled".':'Day planned')}
function quick(d,name,dur,from){const t=findSlot(d,dur,0,null,from);if(t==null)return flash('No free slot for that today');
commit({id:uid(),type:'plan',name,date:d,start:t,dur,travel:0,prio:'med',auto:true},name+' placed at '+fmt(t))}
function recs(d){const r=[],bl=blocks(d).sort((a,b)=>a.s-b.s),today=ymd(new Date());let c=S.set.wake;if(d===today)c=Math.max(c,Math.ceil(nowMin()/5)*5);
const pts=[...bl.map(b=>[b.s,b.e]),[S.set.sleep,S.set.sleep]];
for(const[s,e]of pts){if(s-c>=60){r.push({t:`You have a ${s-c}-minute gap between ${fmt(c)} and ${fmt(s)}. It's a good time for studying or a walk.`,a:`openPlan('${d}',${c})`,b:'Add a plan'});break}c=Math.max(c,e)}
if(bl.length>=3&&bl.every((b,i)=>i==0||b.s-bl[i-1].e<10))r.push({t:'Your day is packed with no breaks. Want to add a 15-minute rest?',a:`quick('${d}','Rest',15,0)`,b:'Add a rest'});
if(bl.length&&!bl.some(b=>/lunch|dinner|meal|eat|breakfast/i.test(b.i.name)))r.push({t:"You haven't scheduled a meal. Lunch around 1 PM might help.",a:`quick('${d}','Lunch',45,750)`,b:'Add lunch'});
const nx=bl.find(b=>b.i.travel>0&&(d!==today||b.i.start>nowMin()));if(nx)r.push({t:`Leave by ${fmt(nx.s)} to reach ${nx.i.name} at ${fmt(nx.i.start)}.`});return r}
/* modals */
function openModal(h){$('#md').innerHTML=h;$('#mo').classList.add('on');const f=$('#md input,#md button');f&&f.focus()}
function closeModal(){$('#mo').classList.remove('on')}
function err(m){const e=$('#err');if(e)e.textContent=m}
function tg(){$('#psw').style.display=document.querySelector('input[name=tm]:checked').value==='exact'?'block':'none'}
function openPlan(d,st){d=d||view.date;openModal(`<h2>Add plan</h2><div id="err" class="err" role="alert"></div>
<label>What is it?<input id="pn" placeholder="Gym, study, groceries"></label>
<div class="row"><label>How long (minutes)<input id="pd" type="number" min="5" step="5" value="60"></label><label>Travel there (minutes)<input id="pt" type="number" min="0" step="5" value="0"></label></div>
<label>Date<input id="pdt" type="date" value="${d}"></label>
<label>Priority<select id="pp"><option value="med">Medium</option><option value="high">High</option><option value="low">Low</option></select></label>
<div class="seg"><label><input type="radio" name="tm" value="auto" ${st==null?'checked':''} onchange="tg()">Let the site pick the time</label><label><input type="radio" name="tm" value="exact" ${st!=null?'checked':''} onchange="tg()">I know the time</label></div>
<label id="psw" style="display:${st!=null?'block':'none'}">Start time<input id="ps" type="time" value="${hm(st==null?720:st)}"></label>
<div class="row"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="savePlan()">Save plan</button></div>`)}
function savePlan(){const nm=$('#pn').value.trim(),dur=+$('#pd').value,tr=Math.max(0,+$('#pt').value||0),d=$('#pdt').value,ex=document.querySelector('input[name=tm]:checked').value==='exact';
if(!nm)return err('Give the plan a name.');if(!(dur>0))return err('Duration must be more than 0 minutes.');if(!d)return err('Pick a date.');
const it={id:uid(),type:'plan',name:nm,date:d,dur,travel:tr,prio:$('#pp').value,auto:!ex};
if(ex){if(!$('#ps').value)return err('Pick a start time.');it.start=tm($('#ps').value);return place(it)}
const t=findSlot(d,dur,tr,null,0);if(t==null)return err('Nothing fits on that day. Shorten the plan, pick another day, or set the time yourself.');
it.start=t;commit(it,'Placed at '+fmt(t))}
function openClass(d){d=d||view.date;openModal(`<h2>Add class or fixed event</h2><div id="err" class="err" role="alert"></div>
<label>Name<input id="cn" placeholder="Physics class"></label>
<div class="row"><label>Starts<input id="cs" type="time" value="18:00"></label><label>Ends<input id="ce" type="time" value="20:00"></label></div>
<label>Date<input id="cdt" type="date" value="${d}"></label><p class="mut">Repeat weekly on (optional)</p>
<div class="days">${['S','M','T','W','T','F','S'].map((x,i)=>`<label><input type="checkbox" class="cd" value="${i}">${x}</label>`).join('')}</div>
<div class="row"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveClass()">Save class</button></div>`)}
function saveClass(){const nm=$('#cn').value.trim(),s=tm($('#cs').value||'0:0'),e=tm($('#ce').value||'0:0'),d=$('#cdt').value;
if(!nm)return err('Give the class a name.');if(!d)return err('Pick a date.');if(e<=s)return err('The end time must be after the start time.');
place({id:uid(),type:'class',name:nm,date:d,start:s,dur:e-s,travel:0,prio:'high',days:[...document.querySelectorAll('.cd:checked')].map(x=>+x.value)})}
function place(it){const c=hits(it);if(!c.length)return commit(it);pend=it;
openModal(`<h2>⚠ Overlap found</h2>${c.map(b=>`<p class="warn">${esc(cm(it,b.i))}</p>`).join('')}<p class="mut">Fixed items win conflicts by default.</p>
<div class="col">${it.type==='plan'?'<button class="btn" onclick="res(\'move\')">Move to next free slot</button>':''}<button class="btn sec" onclick="res('keep')">Keep both anyway</button><button class="btn sec" onclick="res('no')">Cancel</button></div>`)}
function res(k){closeModal();if(k==='keep')commit(pend);if(k==='move'){const t=findSlot(pend.date,pend.dur,pend.travel,null,pend.start-pend.travel);if(t==null)return flash('No later free slot that day');pend.start=t;pend.auto=false;commit(pend,'Moved to '+fmt(t))}}
function commit(it,msg){S.items.push(it);save();closeModal();go('day',it.date,it.id);if(msg)flash(msg)}
function openItem(id){const i=S.items.find(x=>x.id===id);if(!i)return;openModal(`<h2>${esc(i.name)}</h2><p>${fmt(i.start)} to ${fmt(i.start+i.dur)}${i.travel?`, plus ${i.travel} min travel`:''}${i.days&&i.days.length?', repeats weekly':''}</p>
<div class="col">${i.type==='plan'?`<button class="btn" onclick="toggleDone('${id}')">${i.done?'Mark not done':'Mark done'}</button>`:''}<button class="btn dng" onclick="delItem('${id}')">Delete${i.days&&i.days.length?' (all repeats)':''}</button><button class="btn sec" onclick="closeModal()">Close</button></div>`)}
function toggleDone(id){const i=S.items.find(x=>x.id===id);i.done=!i.done;save();closeModal();render()}
function delItem(id){S.items=S.items.filter(x=>x.id!==id);save();closeModal();render()}
/* views */
function home(){const t=ymd(new Date()),n=nowMin(),bl=blocks(t).map(b=>b.i).sort((a,b)=>a.start-b.start),h=new Date().getHours();
const cur=bl.find(i=>i.start<=n&&n<i.start+i.dur),nx=bl.find(i=>i.start>n),cf=confl(t).length,left=bl.filter(i=>!i.done&&i.start+i.dur>n).length,rc=recs(t).slice(0,2);
return `<section class="hero"><h1 class="wm" aria-label="DayPlan">${[...'DAYPLAN'].map((c,i)=>`<span aria-hidden="true" style="--i:${i}">${c}</span>`).join('')}</h1><div class="sub">PLANNER</div>
<p class="greet">${h<12?'Good morning':h<18?'Good afternoon':'Good evening'}. ${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}, ${fmt(n)}</p>
<div class="acts c"><button class="btn" onclick="openPlan('${t}')">Add plan</button><button class="btn sec" onclick="openClass('${t}')">Add class</button><button class="btn sec" onclick="planDay('${t}')">Plan my day</button></div><i class="scrl"></i></section>
<div class="panels"><div class="card"><h3>Today at a glance</h3><p>${cur?`Now: <b>${esc(cur.name)}</b> until ${fmt(cur.start+cur.dur)}`:'Nothing happening right now.'}<br>${nx?`Next: <b>${esc(nx.name)}</b> at ${fmt(nx.start)}`:'Nothing else scheduled today.'}<br>${left} item(s) left today</p>
${cf?`<p class="warn">⚠ ${cf} overlap(s) today</p><button class="lk" onclick="go('day','${t}')">Review conflicts</button>`:''}</div>
<div class="card"><h3>Today's schedule</h3>${bl.length?bl.slice(0,5).map(i=>`<div class="li"><span>${esc(i.name)}</span><span class="mut">${fmt(i.start)}</span></div>`).join('')+`<button class="lk" onclick="go('day','${t}')">Open full day</button>`:'<p class="mut">Nothing planned yet. Add your first plan!</p>'}</div>
<div class="card"><h3>Suggestions</h3>${rc.length?recHtml(rc):'<p class="mut">Add a few plans and your suggestions will show up here.</p>'}</div></div>`}
function recHtml(r){return r.map(x=>`<div class="li"><span>${esc(x.t)}</span>${x.a?`<button class="btn sec" onclick="${x.a}">${x.b}</button>`:''}</div>`).join('')+'<p class="mut">Suggestions are automated and general. Use your own judgment.</p>'}
function day(){const d=view.date,bl=blocks(d).sort((a,b)=>a.s-b.s),cf=confl(d),ids=new Set(cf.flatMap(p=>[p.a.id,p.b.id])),un=itemsOn(d).filter(i=>i.hold);
let lo=S.set.wake,hi=S.set.sleep;bl.forEach(b=>{lo=Math.min(lo,b.s);hi=Math.max(hi,b.e)});const T0=Math.floor(lo/60)*60,T1=Math.ceil(hi/60)*60;T0v=T0;let k=0,h='';
for(let m=T0;m<=T1;m+=60)h+=`<div class="ln" style="top:${(m-T0)*PX}px"><span>${fmt(m)}</span></div>`;
bl.forEach(b=>{const i=b.i,c=ids.has(i.id),side=c?k++%2:0;
if(i.travel>0)h+=`<div class="blk tr" style="top:${(b.s-T0)*PX}px;height:${i.travel*PX}px">Travel</div>`;
h+=`<button class="blk${c?' cf':''}${i.done?' dn':''}" id="b-${i.id}" onclick="openItem('${i.id}')" style="top:${(i.start-T0)*PX}px;height:${Math.max(24,i.dur*PX)}px;left:${side?'50%':'0'};width:${c?'50%':'100%'};background-color:${i.type==='class'?COL.class:COL[i.prio]}"><b>${c?'⚠ ':''}${esc(i.name)}</b><br>${fmt(i.start)}-${fmt(i.start+i.dur)}</button>`});
if(d===ymd(new Date()))h+=`<div class="nw" id="nw" style="top:${(nowMin()-T0)*PX}px"></div>`;
return `<h2>${new Date(d+'T12:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</h2>
<div class="bar"><button class="btn sec" aria-label="Previous day" onclick="shift(-1)">‹</button><input type="date" aria-label="Pick a date" value="${d}" onchange="view.date=this.value||view.date;render()"><button class="btn sec" aria-label="Next day" onclick="shift(1)">›</button><button class="btn sec" onclick="view.date=ymd(new Date());render()">Today</button></div>
<div class="acts"><button class="btn" onclick="openPlan('${d}')">Add plan</button><button class="btn sec" onclick="openClass('${d}')">Add class</button><button class="btn sec" onclick="planDay('${d}')">Plan my day</button></div>
${cf.length?`<div class="cfb"><h3>⚠ ${cf.length} overlap(s) on this day</h3>${cf.map(p=>`<p class="warn">${esc(cm(p.a,p.b))}</p>`).join('')}<p class="mut">Fixed items win conflicts by default.</p><button class="btn" onclick="fix()">Let the site fix it</button></div>`:''}
${bl.length?`<div class="tl" style="height:${(T1-T0)*PX}px">${h}</div>`:'<div class="card"><p class="mut">Nothing planned yet. Add your first plan!</p></div>'}
${un.length?`<div class="card"><h3>Not scheduled</h3>${un.map(i=>`<div class="li"><span>${esc(i.name)} (${i.dur} min)</span><button class="btn sec" onclick="openItem('${i.id}')">Open</button></div>`).join('')}<p class="mut">These didn't fit. Shorten them, change the day, or delete them.</p></div>`:''}
${recs(d).length?`<div class="card"><h3>Suggestions</h3>${recHtml(recs(d))}</div>`:''}`}
function fix(){const m=replan(view.date);render();flash(m?m+' item(s) still don\'t fit':'Fixed. Overlaps resolved where possible')}
function shift(n){view.date=addDays(view.date,n);render()}
function sets(){const s=S.set;return `<h1>Settings</h1><div class="card"><h3>Appearance</h3>
<label>Theme<select onchange="setS('theme',this.value)">${[['auto','Match my device'],['light','Light'],['dark','Dark']].map(o=>`<option value="${o[0]}"${s.theme===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></label>
<label>Text size: <span id="fv">${s.font}%</span><input type="range" min="80" max="160" step="5" value="${s.font}" oninput="fontLive(this.value)" onchange="setS('font',+this.value)"></label>
<p style="margin:0">Sample text: Your day, planned clearly.</p></div>
<div class="card"><h3>Time and schedule</h3><label>Time format<select onchange="setS('h24',this.value==='1')"><option value="0"${s.h24?'':' selected'}>12-hour</option><option value="1"${s.h24?' selected':''}>24-hour</option></select></label>
<div class="row"><label>Wake-up<input type="time" value="${hm(s.wake)}" onchange="setS('wake',tm(this.value))"></label><label>Bedtime<input type="time" value="${hm(s.sleep)}" onchange="setS('sleep',tm(this.value))"></label></div>
<label>Break between plans (minutes)<input type="number" min="0" max="60" value="${s.brk}" onchange="setS('brk',Math.max(0,+this.value||0))"></label></div>
<div class="card"><h3>Your data</h3><p class="mut">Everything is saved only in this browser. Export a backup now and then.</p><div class="col"><button class="btn sec" onclick="exportData()">Export backup</button></div></div>
<div class="card"><h3>Reset planner</h3><div class="col"><button class="btn sec" onclick="ask('today')">Clear today's plans (classes stay)</button><button class="btn sec" onclick="ask('plans')">Clear all plans (classes stay)</button><button class="btn dng" onclick="ask('all')">Factory reset (delete everything)</button></div></div>`}
function fontLive(v){document.documentElement.style.fontSize=v+'%';$('#fv').textContent=v+'%'}
function setS(k,v){if((k==='wake'&&v>=S.set.sleep-60)||(k==='sleep'&&v<=S.set.wake+60)){flash('Wake-up must be at least an hour before bedtime');return render()}S.set[k]=v;save();applyTheme();render()}
function exportData(){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='dayplan-backup.json';a.click()}catch(e){flash('Export failed')}}
function ask(k){fnp=k;const m={today:"all plans on today's date",plans:'all plans on every day',all:'all plans, classes, and settings'}[k];
openModal(`<h2>Are you sure?</h2><p>This deletes ${m}. It can't be undone.</p><div class="col"><button class="btn sec" onclick="exportData()">Export a backup first</button><button class="btn dng" onclick="doReset()">Yes, delete</button><button class="btn sec" onclick="closeModal()">Cancel</button></div>`)}
function doReset(){const t=ymd(new Date());if(fnp==='today')S.items=S.items.filter(i=>!(i.type==='plan'&&i.date===t));
if(fnp==='plans')S.items=S.items.filter(i=>i.type==='class');if(fnp==='all'){S.items=[];S.set={...D}}save();applyTheme();closeModal();render()}
function go(t,d,f){anim=true;view.tab=t;if(d)view.date=d;render();window.scrollTo(0,0);
if(f)setTimeout(()=>{const e=document.getElementById('b-'+f);if(e){e.scrollIntoView({behavior:'smooth',block:'center'});e.classList.add('pulse')}},80)}
function updNow(){const e=$('#nw');if(e)e.style.top=(nowMin()-T0v)*PX+'px'}
function render(){const A=$('#app');A.innerHTML=view.tab==='home'?home():view.tab==='day'?day():sets();A.dataset.v=view.tab;A.classList.toggle('anim',anim);anim=false;[...A.children].forEach((c,i)=>c.style.setProperty('--k',i));
document.querySelectorAll('nav button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.t===view.tab)||b.removeAttribute('aria-current'));
document.querySelectorAll('nav button[aria-current]').forEach(b=>b.setAttribute('aria-current','page'));const ab=document.querySelector('nav button[aria-current]'),pl=$('#pill');if(ab&&pl){pl.style.width=ab.offsetWidth+'px';pl.style.transform='translateX('+ab.offsetLeft+'px)'}}
setInterval(()=>{if($('#mo').classList.contains('on'))return;if(view.tab==='home')render();updNow()},30000);
(function(){const cv=$('#bg');let gl=null;try{gl=cv.getContext('webgl')}catch(e){}if(!gl)return;
const vs='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}',
fs=`precision mediump float;uniform vec2 r;uniform vec2 m;uniform float t;uniform float L;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=p*2.02+vec2(1.7,9.2);a*=.5;}return v;}
void main(){vec2 uv=gl_FragCoord.xy/r;vec2 p=uv*vec2(r.x/r.y,1.)*2.2+m*.35;
vec2 q=vec2(fbm(p+t*.03),fbm(p+vec2(5.2,1.3)-t*.025));float c=fbm(p+2.*q+vec2(t*.02,0.));
vec3 d=mix(vec3(.04,.06,.08),vec3(.31,.33,.36),smoothstep(.2,.9,c));
float g=smoothstep(.9,0.,distance(uv,vec2(.15,.8)));d+=vec3(.55,.42,.38)*g*.3*smoothstep(.25,.8,c);
vec3 l=mix(vec3(.78,.84,.83),vec3(.97,.98,.97),smoothstep(.2,.9,c));l+=vec3(.12,.06,.02)*g*.4;
vec3 col=mix(d,l,L);col*=1.-.38*distance(uv,vec2(.5))*(1.-L*.7);gl_FragColor=vec4(col,1.);}`;
function sh(k,s){const o=gl.createShader(k);gl.shaderSource(o,s);gl.compileShader(o);return o}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);
if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return;gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const a=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
const U=k=>gl.getUniformLocation(pr,k),ur=U('r'),ut=U('t'),um=U('m'),uL=U('L'),rm=matchMedia('(prefers-reduced-motion: reduce)');
let mx=0,my=0,sx=0,sy=0;const t0=performance.now();
function size(){cv.width=Math.max(2,innerWidth*.5|0);cv.height=Math.max(2,innerHeight*.5|0);gl.viewport(0,0,cv.width,cv.height)}
addEventListener('resize',()=>{size();if(rm.matches)requestAnimationFrame(frame)});size();
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=.5-e.clientY/innerHeight});
function frame(now){sx+=(mx-sx)*.04;sy+=(my-sy)*.04;gl.uniform2f(ur,cv.width,cv.height);gl.uniform1f(ut,rm.matches?0:(now-t0)/1000);
gl.uniform2f(um,sx,sy);gl.uniform1f(uL,document.documentElement.dataset.t==='light'?1:0);gl.drawArrays(gl.TRIANGLES,0,3);if(!rm.matches)requestAnimationFrame(frame)}
window.bgRedraw=()=>{if(rm.matches)requestAnimationFrame(frame)};requestAnimationFrame(frame);
})();
applyTheme();render();function pl(){const ab=document.querySelector('nav button[aria-current]'),e=$('#pill');if(ab&&e){e.style.width=ab.offsetWidth+'px';e.style.transform='translateX('+ab.offsetLeft+'px)'}}document.fonts&&document.fonts.ready.then(pl);addEventListener('resize',pl);
</script></body></html>
